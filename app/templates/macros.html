{% macro render_field(field, class_name="form-control") %}
<div class="mb-3">

    {{ field.label(class="form-label") }}

    {{ field(class=class_name) }}

    {% if field.errors %}
        <ul class="text-danger">
            {% for error in field.errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    {% endif %}

</div>
{% endmacro %}
