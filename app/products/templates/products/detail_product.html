
{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>{{ product.name }}</h1>

    <p>{{ product.content }}</p>

    <p>
        <strong>Ціна: {{ product.price }} $</strong>
    </p>

    <p>Ідентифікатор товару: {{ product.id }}</p>

    <a href="{{ url_for('products.list_products') }}"
       class="btn btn-secondary">
        Назад до товарів
    </a>
</div>
{% endblock %}
