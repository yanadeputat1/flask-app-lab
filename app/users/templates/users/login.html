
{% extends "base.html" %}

{% block content %}

<div class="container mt-4" style="max-width: 500px;">
    <h1 class="mb-4">Вхід</h1>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
            <label for="username" class="form-label">
                Ім'я користувача
            </label>

            <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                placeholder="Введіть ім'я користувача"
                required
            >
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">
                Пароль
            </label>

            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Введіть пароль"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Увійти
        </button>
    </form>

    <p class="mt-3">
        Ще не маєте акаунта?
        <a href="{{ url_for('users.register') }}">Зареєструватися</a>
    </p>
</div>

{% endblock %}
